<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" role="img" aria-labelledby="vdoTitle vdoDesc">
  <title id="vdoTitle">VDO.Ninja to C-Play — three integration options</title>
  <desc id="vdoDesc">Option A: guest publishes over WHIP to the VDO.Ninja hosted service and C-Play pulls it with a WebRTC layer. Option B: guest joins a VDO.Ninja room, OBS renders the view link in a browser source and sends NDI to C-Play. Option C: guest publishes over WHIP to your own MediaMTX server (routed by the &amp;mediamtx parameter) and C-Play pulls it with a WebRTC layer.</desc>

  <defs>
    <marker id="ah-light" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#57606a"/>
    </marker>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title      { font-size: 23px; font-weight: 700; fill: #1f2328; }
    .subtitle   { font-size: 14px; fill: #57606a; }
    .band       { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .optTitle   { font-size: 17px; font-weight: 700; fill: #1f2328; }
    .badge      { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1; }
    .badgeText  { font-size: 12px; font-weight: 600; fill: #57606a; }
    .boxGuest   { fill: #e7f1fd; stroke: #4c8dd6; stroke-width: 1.5; }
    .boxService { fill: #fcf4de; stroke: #d9a520; stroke-width: 1.5; }
    .boxLocal   { fill: #ecf6ee; stroke: #4ea157; stroke-width: 1.5; }
    .boxCplay   { fill: #123c69; stroke: #2e6ca8; stroke-width: 1.5; }
    .boxTitle   { font-size: 15px; font-weight: 700; fill: #1f2328; }
    .boxTitleSm { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .boxSub     { font-size: 12px; fill: #57606a; }
    .boxNote    { font-size: 11px; font-style: italic; fill: #57606a; }
    .cplayTitle { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .cplaySub   { font-size: 12.5px; fill: #cfe3f7; }
    .arrow      { stroke: #57606a; stroke-width: 2; fill: none; marker-end: url(#ah-light); }
    .arrowLabel { font-size: 13px; font-weight: 700; fill: #1f2328; }
    .arrowSm    { font-size: 11.5px; font-weight: 600; fill: #57606a; }
    .arrowNote  { font-size: 11px; fill: #57606a; }
    .dashedBox  { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .dashedLine { stroke: #8b949e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ah-light); }
    .footer     { font-size: 12px; fill: #57606a; }

    @media (prefers-color-scheme: dark) {
      .title, .optTitle, .boxTitle, .boxTitleSm, .arrowLabel { fill: #e6edf3; }
      .subtitle, .badgeText, .boxSub, .boxNote, .arrowSm, .arrowNote, .footer { fill: #adbac7; }
      .band       { fill: #161b22; stroke: #30363d; }
      .badge      { fill: #21262d; stroke: #30363d; }
      .boxGuest   { fill: #0d2a43; stroke: #58a6ff; }
      .boxService { fill: #2e230b; stroke: #d29922; }
      .boxLocal   { fill: #0f2c1a; stroke: #3fb950; }
      .arrow, .dashedLine { stroke: #8b949e; marker-end: url(#ah-dark); }
    }
  </style>

  <!-- Header -->
  <text x="620" y="38" text-anchor="middle" class="title">Bringing VDO.Ninja guests into C-Play</text>
  <text x="620" y="62" text-anchor="middle" class="subtitle">Three ways to bring a remote guest stream into a C-Play presentation</text>

  <!-- ================= Option A ================= -->
  <rect x="20" y="84" width="1200" height="190" rx="12" class="band"/>
  <text x="40" y="116" class="optTitle">Option A — Direct VDO.Ninja WHEP</text>
  <rect x="996" y="98" width="200" height="26" rx="13" class="badge"/>
  <text x="1096" y="115.5" text-anchor="middle" class="badgeText">new in 2.4 · WebRTC build</text>

  <rect x="40" y="138" width="210" height="96" rx="10" class="boxGuest"/>
  <text x="145" y="178" text-anchor="middle" class="boxTitle">Guest camera / screen</text>
  <text x="145" y="200" text-anchor="middle" class="boxSub">browser or OBS Studio 30+</text>

  <rect x="470" y="138" width="330" height="96" rx="10" class="boxService"/>
  <text x="635" y="168" text-anchor="middle" class="boxTitle">VDO.Ninja hosted service</text>
  <text x="635" y="192" text-anchor="middle" class="boxSub">WHIP in: whip.vdo.ninja/&lt;TOKEN&gt;</text>
  <text x="635" y="210" text-anchor="middle" class="boxSub">WHEP out: whep.vdo.ninja/&lt;TOKEN&gt;</text>
  <text x="635" y="228" text-anchor="middle" class="boxNote">TURN included — no ports to open on your side</text>

  <rect x="990" y="138" width="210" height="96" rx="10" class="boxCplay"/>
  <text x="1095" y="178" text-anchor="middle" class="cplayTitle">C-Play</text>
  <text x="1095" y="200" text-anchor="middle" class="cplaySub">WebRTC layer</text>

  <line x1="252" y1="186" x2="464" y2="186" class="arrow"/>
  <text x="358" y="172" text-anchor="middle" class="arrowLabel">WHIP publish</text>
  <line x1="984" y1="186" x2="806" y2="186" class="arrow"/>
  <text x="895" y="172" text-anchor="middle" class="arrowLabel">WHEP pull</text>

  <!-- ================= Option B ================= -->
  <rect x="20" y="294" width="1200" height="190" rx="12" class="band"/>
  <text x="40" y="326" class="optTitle">Option B — OBS bridge</text>
  <rect x="1076" y="308" width="120" height="26" rx="13" class="badge"/>
  <text x="1136" y="325.5" text-anchor="middle" class="badgeText">all versions</text>

  <rect x="40" y="348" width="190" height="96" rx="10" class="boxGuest"/>
  <text x="135" y="401" text-anchor="middle" class="boxTitleSm">Guest camera / screen</text>

  <rect x="310" y="348" width="210" height="96" rx="10" class="boxService"/>
  <text x="415" y="386" text-anchor="middle" class="boxTitle">VDO.Ninja room</text>
  <text x="415" y="408" text-anchor="middle" class="boxSub">view link for the guest</text>

  <rect x="600" y="348" width="280" height="96" rx="10" class="boxLocal"/>
  <text x="740" y="378" text-anchor="middle" class="boxTitle">OBS Studio</text>
  <text x="740" y="400" text-anchor="middle" class="boxSub">Browser source renders the view link</text>
  <text x="740" y="418" text-anchor="middle" class="boxSub">NDI output: OBS VDO Ninja</text>

  <rect x="970" y="348" width="230" height="96" rx="10" class="boxCplay"/>
  <text x="1085" y="386" text-anchor="middle" class="cplayTitle">C-Play</text>
  <text x="1085" y="408" text-anchor="middle" class="cplaySub">NDI layer</text>

  <line x1="232" y1="396" x2="304" y2="396" class="arrow"/>
  <text x="268" y="384" text-anchor="middle" class="arrowSm">joins room</text>
  <line x1="524" y1="396" x2="594" y2="396" class="arrow"/>
  <text x="559" y="384" text-anchor="middle" class="arrowSm">view link</text>
  <line x1="884" y1="396" x2="964" y2="396" class="arrow"/>
  <text x="924" y="384" text-anchor="middle" class="arrowLabel">NDI</text>

  <!-- ================= Option C ================= -->
  <rect x="20" y="504" width="1200" height="210" rx="12" class="band"/>
  <text x="40" y="536" class="optTitle">Option C — Self-hosted MediaMTX</text>
  <rect x="996" y="518" width="200" height="26" rx="13" class="badge"/>
  <text x="1096" y="535.5" text-anchor="middle" class="badgeText">new in 2.4 · WebRTC build</text>

  <rect x="40" y="558" width="210" height="96" rx="10" class="boxGuest"/>
  <text x="145" y="588" text-anchor="middle" class="boxTitle">Guest browser</text>
  <text x="145" y="610" text-anchor="middle" class="boxSub">vdo.ninja link with &amp;room,</text>
  <text x="145" y="628" text-anchor="middle" class="boxSub">&amp;push=ID, &amp;mediamtx=&lt;server&gt;</text>

  <rect x="470" y="558" width="330" height="96" rx="10" class="boxLocal"/>
  <text x="635" y="588" text-anchor="middle" class="boxTitle">Your MediaMTX server</text>
  <text x="635" y="610" text-anchor="middle" class="boxSub">WHIP in on :8889 · WHEP out at:</text>
  <text x="635" y="628" text-anchor="middle" class="boxSub">/&lt;room&gt;/&lt;stream ID&gt;/whep</text>
  <text x="635" y="646" text-anchor="middle" class="boxNote">Basic auth — your firewall &amp; TURN</text>

  <rect x="990" y="558" width="210" height="96" rx="10" class="boxCplay"/>
  <text x="1095" y="598" text-anchor="middle" class="cplayTitle">C-Play</text>
  <text x="1095" y="620" text-anchor="middle" class="cplaySub">WebRTC layer</text>

  <line x1="252" y1="606" x2="464" y2="606" class="arrow"/>
  <text x="358" y="592" text-anchor="middle" class="arrowLabel">WHIP publish</text>
  <text x="358" y="626" text-anchor="middle" class="arrowNote">(routed by &amp;mediamtx)</text>
  <line x1="984" y1="606" x2="806" y2="606" class="arrow"/>
  <text x="895" y="592" text-anchor="middle" class="arrowLabel">WHEP pull</text>

  <path d="M 145 656 V 688 H 302" class="dashedLine"/>
  <rect x="310" y="672" width="260" height="32" rx="8" class="dashedBox"/>
  <text x="440" y="693" text-anchor="middle" class="boxSub">VDO.Ninja room — director view</text>

  <!-- Footer -->
  <text x="620" y="752" text-anchor="middle" class="footer">Options A and C require a C-Play build compiled with WebRTC support (BUILD_CPLAY_WITH_WEBRTC) · Option B works on all versions</text>

</svg>
